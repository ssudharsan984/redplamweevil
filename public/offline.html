<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — RPW Detection</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #14532d, #16a34a);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        padding: 1rem;
      }
      .card {
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 1.5rem;
        padding: 3rem 2rem;
        text-align: center;
        max-width: 400px;
        width: 100%;
      }
      .icon { font-size: 4rem; margin-bottom: 1rem; }
      h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem; }
      p { color: rgba(255,255,255,0.75); font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }
      button {
        background: white;
        color: #16a34a;
        border: none;
        padding: 0.75rem 2rem;
        border-radius: 0.75rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      button:hover { opacity: 0.9; }
      .status {
        margin-top: 1.5rem;
        font-size: 0.8rem;
        color: rgba(255,255,255,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      .dot {
        width: 8px; height: 8px;
        background: #fbbf24;
        border-radius: 50%;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">🌴</div>
      <h1>You're Offline</h1>
      <p>
        No internet connection detected.<br />
        The RPW Detection System needs a connection to load live trap data from Firebase.
      </p>
      <button onclick="window.location.reload()">🔄 Try Again</button>
      <div class="status">
        <div class="dot"></div>
        Waiting for connection...
      </div>
    </div>
    <script>
      // Auto-reload when connection is restored
      window.addEventListener('online', () => window.location.reload())
    </script>
  </body>
</html>
